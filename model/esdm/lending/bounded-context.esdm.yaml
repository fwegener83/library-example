apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: lending
scope:
  domain: millbrook-library-tutorial
ubiquitousLanguage:
  - term: reader
    avoid:
      - term: patron
        reason: LibTrack's word for the same person (C-07).
      - term: member
        reason: The membership office's word; here the person is a reader (C-07).
    definition: The person who borrows and reserves, as seen at the lending desk.
  - term: copy
    avoid:
      - term: book
        reason: Everyday speech only; the model says copy or title (C-07).
      - term: item
        reason: Same as copy (C-07).
    definition: 'A physical book and what may be done with it right now: on the shelf, reserved or on loan.'
  - term: loan
    definition: A copy held by a reader until its due date.
  - term: due date
    definition: The day by which a loan must be returned.
  - term: overdue
    definition: A loan not returned by its due date.
  - term: reservation
    definition: A copy on the shelf set aside behind the desk for a reader until it is collected or runs out.
  - term: researcher
    definition: 'A reader whom membership reports as a researcher: may borrow restricted copies and has no reservation limit.'
  - term: branch
    definition: 'One of the four library sites: Central, Riverside, Northgate, Old Town.'
  - term: morning list
    definition: 'The two lists a branch gets every morning: reservations that ran out and loans that are overdue.'
metadata:
