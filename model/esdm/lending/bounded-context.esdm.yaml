apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: lending
scope:
  domain: millbrook-library-tutorial
ubiquitousLanguage:
  - term: reader
    avoid:
      - term: patron
        reason: LibTrack's word for the same person (C-07).
      - term: member
        reason: The membership office's word; here the person is a reader (C-07).
    definition: The person who borrows and reserves, as seen at the lending desk.
  - term: copy
    avoid:
      - term: book
        reason: Everyday speech only; the model says copy or title (C-07).
      - term: item
        reason: Same as copy (C-07).
    definition: 'A physical book and what may be done with it right now: on the shelf at a branch, reserved, on loan, lost or damaged.'
  - term: restricted copy
    definition: A copy the catalogue reports as restricted. Only a researcher may borrow or reserve it, never after the end date of the status (C-28, C-29).
  - term: loan
    definition: A copy held by a reader until its due date.
  - term: due date
    definition: The day by which a loan must be returned.
  - term: overdue
    definition: A loan not returned by its due date.
  - term: reservation
    definition: A copy on the shelf set aside behind the desk for a reader until it is collected or runs out.
  - term: keep
    definition: A reservation for a researcher without a time limit. When the status ends it becomes a normal reservation that runs out from that day; a keep of a restricted copy ends (C-32).
  - term: researcher
    definition: 'A reader whom membership reports as a researcher, up to the end date of the status (C-28): may borrow restricted copies, may ask for keeps and has no reservation limit.'
  - term: branch
    definition: 'One of the four library sites: Central, Riverside, Northgate, Old Town. A copy is on the shelf at one branch at a time; its home branch comes from the catalogue (C-24). In this context the word has four roles, kept apart by the field names: the home branch (from the catalogue), the branch where the copy stands now (`current-branch`), the branch of a checkout or reservation, and the branch of a return. Which of them counts for the overdue limit is open (C-14).'
  - term: lost copy
    definition: A copy the reader reports lost at the desk. The loan ends and the copy is listed for the Head of Collection, who withdraws it in the catalogue (C-04, C-20). If it comes back, it is taken in as found and listed for the Head of Collection again (C-30).
  - term: damaged copy
    definition: A copy found damaged at check-in. Not lendable and listed for the Head of Collection, who withdraws it or, after repair, releases it in the catalogue (C-06, C-25).
  - term: morning list
    definition: 'The two lists a branch gets every morning: reservations that ran out and loans that are overdue. Lending supplies the loans and reservations; the staff page adds names and phone numbers from membership and titles from the catalogue (C-31).'
  - term: member identifier
    definition: 'The identifier that membership issues for a person (ADR 7). It keeps its name in the fields of this context, `member-id`, although the person is called a reader here (C-07): it is the name of the key, not a concept of this context.'
