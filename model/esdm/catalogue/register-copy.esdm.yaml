apiVersion: schema.esdm.io/core/v1
kind: command
name: register-copy
scope:
  aggregate: copy
  boundedContext: catalogue
  domain: millbrook-library-tutorial
data:
  properties:
    home-branch:
      type: string
    kind:
      enum:
        - circulating
        - restricted
      type: string
    title-id:
      type: string
    usage-fee-copy:
      type: boolean
  required:
    - title-id
    - kind
    - usage-fee-copy
    - home-branch
  type: object
publishes:
  - copy-registered
actors:
  - head-of-collection
constraints:
  - name: title-must-exist
    rule: A copy can only be registered for a title that is in the catalogue (brief 3.1).
metadata:
  annotations:
    studio.id: 7b23ba84-86d2-4c46-9485-0c3ddaedb911
