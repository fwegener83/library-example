apiVersion: schema.esdm.io/core/v1
kind: bounded-context
name: catalogue
scope:
  domain: millbrook-library-tutorial
ubiquitousLanguage:
  - term: title
    avoid:
      - term: book
        reason: Means the entry and the physical thing at once; we need to tell them apart (C-07).
    definition: 'The catalogue entry for a work: ISBN, title, author and replacement price. One entry however many copies exist.'
  - term: copy
    avoid:
      - term: item
        reason: Same thing as copy in the brief; one word is chosen (C-07).
      - term: instance
        reason: LibTrack's word for the same thing (C-07).
    definition: One physical book with its own barcode, registered under a title with a home branch. Circulating or restricted; may be a usage-fee copy.
  - term: circulating
    definition: A copy any reader may borrow.
  - term: restricted
    definition: 'A copy only researchers may borrow: signed first editions, the local history collection, anything the archive lent.'
  - term: usage-fee copy
    avoid:
      - term: special collection
        reason: The brief's word for the part of the collection the archive and the university fund. Only some copies in it carry a fee, so the mark on the copy is what counts (C-21).
    definition: A copy for which the archive asks a usage fee. Marked by the Head of Collection when the copy is registered, independent of circulating or restricted. The amount is not known here; it is a tariff of fees (C-21).
  - term: home branch
    definition: The branch a copy belongs to, set when it is registered. Where the copy is right now is not known here (C-24).
  - term: withdrawn copy
    definition: A copy taken out of the collection by the Head of Collection, after it was lost or damaged beyond repair. Still recorded, no longer lendable (C-17, C-20).
  - term: replacement price
    definition: The price recorded on a title; what a lost copy is charged at.
