description: 'The 10 euro rule belongs to fees (C-19): fees decides when a reader is in arrears and places or lifts the hold "unpaid fees" on the member''s card. Membership owns the card and its holds (a card with at least one hold is blocked) and knows nothing about money. What fees negotiates: placing and lifting its own hold, never another one. ADR 5.'
