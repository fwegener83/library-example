apiVersion: schema.esdm.io/core/v1
kind: context-mapping
name: fees-membership-customer-supplier
description: 'Membership blocks and unblocks the card from what the member owes (C-01, C-03). Fees tells it when the amount owed (fines, lost-book fees and usage fees, C-18) passes 10 euro or is back at 10 euro or less; membership decides what blocking means. Note: with lending and membership this mapping closes a circle of dependencies; ADR 5 proposes to turn it around (membership as supplier, fees as customer).'
type: customer-supplier
supplier:
  domain: millbrook-library-tutorial
  boundedContext: fees
customer:
  domain: millbrook-library-tutorial
  boundedContext: membership
