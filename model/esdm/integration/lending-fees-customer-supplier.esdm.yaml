apiVersion: schema.esdm.io/core/v1
kind: context-mapping
name: lending-fees-customer-supplier
description: 'Fees is the only consumer of the loan events, and its needs shaped them: copy checked out (with the loan, the reader, the title and the due date), copy returned, copy declared lost, each naming the loan and the reader and carrying the business day (C-03, C-04, ADR 11). No event says that a loan became overdue: fees counts from the due date, and the morning lists are a question to lending (chapter 7). Lending knows fees as its customer, plans these events for it and tells fees before it changes them; it does not depend on fees in code and does not know what fees does with the events (ADR 3, ADR 5). Whether a checkout carries a usage fee is decided in fees from the catalogue''s mark (C-21). ADR 9.'
type: customer-supplier
supplier:
  domain: millbrook-library-tutorial
  boundedContext: lending
customer:
  domain: millbrook-library-tutorial
  boundedContext: fees
