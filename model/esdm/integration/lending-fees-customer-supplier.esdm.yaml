description: 'Fees is the only consumer of the loan events, and its needs shaped them: checked out, became overdue, returned, declared lost, each with the copy, the reader and the due date (C-03, C-04). Lending plans these events for fees and tells fees before it changes them; it still knows nothing about fees. Whether a checkout carries a usage fee is decided in fees from the catalogue''s mark (C-21). ADR 9.'
